<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1B1B3A" />
<title>Day Arc — Routine Planner</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="date-block">
    <p class="eyebrow" id="dayName">Wednesday</p>
    <h1 id="dateFull">August 19</h1>
  </div>
  <div class="score-block">
    <svg class="ring" width="72" height="72" viewBox="0 0 72 72">
      <circle class="ring-track" cx="36" cy="36" r="30" />
      <circle class="ring-fill" id="ringFill" cx="36" cy="36" r="30" />
    </svg>
    <div class="ring-label">
      <span id="scorePct">0%</span>
    </div>
  </div>
</header>

<div class="streak-bar" id="streakBar">
  <span class="streak-flame">🔥</span>
  <span id="streakText">0 day streak</span>
</div>

<main class="timeline-wrap" id="timelineWrap">
  <div class="timeline-spine"></div>
  <div class="now-marker" id="nowMarker"><span>now</span></div>
  <ol class="timeline" id="timeline"></ol>
  <p class="empty-state" id="emptyState">Your day is blank. Add your first task — waking up is a good start.</p>
</main>

<button class="fab" id="addBtn" aria-label="Add task">+</button>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<form class="sheet" id="taskSheet">
  <h2 id="sheetTitle">Add task</h2>
  <label>
    Time
    <input type="time" id="fTime" required />
  </label>
  <label>
    Task
    <input type="text" id="fTitle" placeholder="e.g. Wake up, Gym, Read" required maxlength="60" />
  </label>
  <label>
    Points
    <input type="number" id="fPoints" min="1" max="100" value="10" required />
  </label>
  <label class="check-row">
    <input type="checkbox" id="fReminder" />
    Remind me at this time
  </label>
  <div class="sheet-actions">
    <button type="button" class="btn ghost" id="deleteBtn" hidden>Delete</button>
    <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
    <button type="submit" class="btn primary" id="saveBtn">Save</button>
  </div>
</form>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
